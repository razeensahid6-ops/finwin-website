<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Finwin Edu Campus PHSRC accreditation</title>
  <desc id="description">A decorative certificate graphic announcing approval as a Private Medical Institution under registration number PHSCH/OMI/626.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f343a"/>
      <stop offset="1" stop-color="#174c55"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d996"/>
      <stop offset="1" stop-color="#d9a23b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#071c20" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="46" fill="url(#background)"/>
  <circle cx="1080" cy="100" r="250" fill="none" stroke="#f4d996" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="1080" cy="100" r="180" fill="none" stroke="#f4d996" stroke-opacity="0.1" stroke-width="2"/>
  <circle cx="105" cy="710" r="190" fill="none" stroke="#f4d996" stroke-opacity="0.1" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="92" y="86" width="1016" height="628" rx="34" fill="#fffdf8"/>
    <rect x="114" y="108" width="972" height="584" rx="24" fill="none" stroke="url(#gold)" stroke-width="3"/>
  </g>
  <g transform="translate(164 154)">
    <circle cx="88" cy="88" r="88" fill="#174c55"/>
    <circle cx="88" cy="88" r="68" fill="none" stroke="#f4d996" stroke-width="4"/>
    <path d="M52 89l23 23 51-57" fill="none" stroke="#f4d996" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="372" y="188" fill="#d9a23b" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="5">OFFICIAL ANNOUNCEMENT</text>
  <text x="372" y="244" fill="#123039" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Approved Private</text>
  <text x="372" y="296" fill="#123039" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Medical Institution</text>
  <line x1="164" y1="382" x2="1034" y2="382" stroke="#d9a23b" stroke-width="2"/>
  <text x="164" y="438" fill="#647477" font-family="Arial, Helvetica, sans-serif" font-size="25">PRIVATE HEALTH SERVICES REGULATORY COUNCIL</text>
  <text x="164" y="482" fill="#174c55" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Ministry of Health</text>
  <text x="164" y="566" fill="#647477" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="3">REGISTRATION NUMBER</text>
  <rect x="164" y="592" width="420" height="66" rx="33" fill="#174c55"/>
  <text x="374" y="635" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle">PHSCH/OMI/626</text>
  <text x="1034" y="624" fill="#123039" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="end">NURSING TRAINING SCHOOL</text>
  <text x="1034" y="654" fill="#647477" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="end">Finwin Edu Campus</text>
</svg>
